<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const WHATSAPP_NUMBER = "919758595891";

const SUPABASE_URL = "https://ssakjibirznasbipdbdv.supabase.co";
const SUPABASE_KEY = "sb_publishable_0l2oYMJ8qyXfRndkXWfrag_Nlk2xnLb";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let selected = "";

function book(service) {
  selected = service;
  document.getElementById("selectedService").innerText =
    "चुनी गई सर्विस: " + service;
  document.getElementById("bookingModal").style.display = "flex";
}

function closeBooking() {
  document.getElementById("bookingModal").style.display = "none";
}

function filterServices() {
  let value = document.getElementById("search").value.toLowerCase();
  let items = document.querySelectorAll(".service");
  let count = 0;

  items.forEach(item => {
    let match = item.innerText.toLowerCase().includes(value);
    item.style.display = match ? "block" : "none";
    if (match) count++;
  });

  document.getElementById("noResult").style.display =
    count === 0 ? "block" : "none";
}

document.getElementById("bookingForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  let name = document.getElementById("customerName").value.trim();
  let phone = document.getElementById("customerPhone").value.trim();
  let address = document.getElementById("customerAddress").value.trim();
  let city = document.getElementById("city").value;

  if (!/^[0-9]{10}$/.test(phone)) {
    alert("कृपया सही 10 अंकों का मोबाइल नंबर डालें।");
    return;
  }

  if (!name || !address || !selected) {
    alert("कृपया सभी जानकारी भरें।");
    return;
  }

  const submitButton = this.querySelector('button[type="submit"]');
  submitButton.disabled = true;
  submitButton.innerText = "बुकिंग सेव हो रही है...";

  try {
    const { error } = await db.from("bookings").insert([{
      customer_name: name,
      phone: phone,
      service: selected,
      city: city,
      address: address,
      status: "new"
    }]);

    if (error) {
      console.error(error);
      alert("बुकिंग डेटाबेस में सेव नहीं हुई। कृपया दोबारा कोशिश करें।");
      return;
    }

    let message =
      "🙏 NEW SERVICE BOOKING - SERVICE MITRA\n" +
      "--------------------------\n" +
      "👤 ग्राहक का नाम: " + name + "\n" +
      "📞 मोबाइल नंबर: " + phone + "\n" +
      "🛠️ सर्विस: " + selected + "\n" +
      "📍 शहर: " + city + "\n" +
      "🏠 पता: " + address + "\n" +
      "--------------------------\n" +
      "कृपया मेरी सर्विस बुकिंग स्वीकार करें।";

    let whatsappURL =
      "https://wa.me/" + WHATSAPP_NUMBER +
      "?text=" + encodeURIComponent(message);

    window.location.href = whatsappURL;

  } catch (err) {
    console.error(err);
    alert("कुछ समस्या आई है। कृपया दोबारा कोशिश करें।");
  } finally {
    submitButton.disabled = false;
    submitButton.innerText = "WhatsApp पर बुक करें";
  }
});
</script>
